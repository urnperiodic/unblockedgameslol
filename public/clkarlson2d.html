<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Karlson 2D</title>
    <style>
      html, body { padding: 0; margin: 0; background: #231F20; width: 100%; height: 100%; overflow: hidden; }
      #unity-container { position: fixed; left: 0; top: 0; width: 100%; height: 100%; }
      #unity-canvas { width: 100%; height: 100%; display: block; background: #231F20; }
      #unity-loading-bar { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: none; }
      #unity-logo { width: 154px; height: 130px; background: url('https://cdn.jsdelivr.net/gh/PopsicleYT/pinkdih-ports@main/karlson2dweb/TemplateData/unity-logo-dark.png') no-repeat center; }
      #unity-progress-bar-empty { width: 141px; height: 18px; margin-top: 10px; margin-left: 6.5px; background: url('https://cdn.jsdelivr.net/gh/PopsicleYT/pinkdih-ports@main/karlson2dweb/TemplateData/progress-bar-empty-dark.png') no-repeat center; }
      #unity-progress-bar-full { width: 0%; height: 18px; margin-top: 10px; background: url('https://cdn.jsdelivr.net/gh/PopsicleYT/pinkdih-ports@main/karlson2dweb/TemplateData/progress-bar-full-dark.png') no-repeat center; }
      #unity-footer { display: none !important; }
      #unity-warning { position: absolute; left: 50%; top: 5%; transform: translate(-50%); background: white; padding: 10px; display: none; z-index: 10; }
    </style>
    <link rel="shortcut icon" href="https://cdn.jsdelivr.net/gh/PopsicleYT/pinkdih-ports@main/karlson2dweb/TemplateData/favicon.ico">
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
        <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Karlson 2D</div>
      </div>
    </div>

    <script>
      var canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "https://cdn.jsdelivr.net/gh/PopsicleYT/pinkdih-ports@main/karlson2dweb/Build";
      var loaderUrl = buildUrl + "/test2.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/test2.data",
        frameworkUrl: buildUrl + "/test2.framework.js",
        codeUrl: buildUrl + "/test2.wasm",
        streamingAssetsUrl: "https://cdn.jsdelivr.net/gh/PopsicleYT/pinkdih-ports@main/karlson2dweb/StreamingAssets",
        companyName: "pinktiplmao",
        productName: "karlson2dport",
        productVersion: "1.0",
        showBanner: unityShowBanner,
        matchWebGLToCanvasSize: true,
      };
var meta = document.createElement('meta');
      meta.name = 'viewport';
      meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
      document.getElementsByTagName('head')[0].appendChild(meta);

      document.querySelector("#unity-loading-bar").style.display = "block";
      fetch(loaderUrl)
        .then((res) => {
          if (!res.ok) throw new Error("HTTP " + res.status);
          return res.text();
        })
        .then((code) => {
          var blob = new Blob([code], { type: "text/javascript" });
          var script = document.createElement("script");
          script.src = URL.createObjectURL(blob);
          script.onload = () => {
            createUnityInstance(canvas, config, (progress) => {
              document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
            }).then((unityInstance) => {
              document.querySelector("#unity-loading-bar").style.display = "none";
            }).catch((message) => {
              alert(message);
            });
          };
          script.onerror = () => {
            unityShowBanner("Failed to execute the game loader script.", "error");
          };
          document.body.appendChild(script);
        })
        .catch((err) => {
          unityShowBanner("Failed to fetch the game loader script: " + err.message, "error");
        });
    </script>
  </body>
</html>
