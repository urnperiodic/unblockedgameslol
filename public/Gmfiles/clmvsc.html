  <!-- Ultimate Game Stash file-->
  <!-- For the regularly updating doc go to https://docs.google.com/document/d/1_FmH3BlSBQI7FGgAQL59-ZPe8eCxs35wel6JUyVaG8Q/ -->
<html>
  <head>
    <script>
      window.gameconfig = {
        name: "Marvel vs Capcom",
        romName: "mvscu.zip", 
        url: "https://cdn.jsdelivr.net/gh/ap-math-class/exams@main/mame/test/mvscu.zip",
        core: "arcade",
        min: 1,
        max: 3,
      };
    </script>

    <script>
      async function mergeFiles(fileParts, onProgress) {
        const buffers = [];

        for (let index = 0; index < fileParts.length; index++) {
          const response = await fetch(fileParts[index]);

          if (!response.ok) {
            throw new Error(
              `Failed to download ${fileParts[index]}: ` +
                `${response.status} ${response.statusText}`,
            );
          }
          buffers.push(await response.arrayBuffer());
          onProgress(index + 1);
        }

        const mergedBlob = new Blob(buffers, {
          type: "application/zip",
        });
        return new File(
          [mergedBlob],
          window.gameconfig.romName,
          {
            type: "application/zip",
          },
        );
      }

      function getParts(file, start, end) {
        const parts = [];

        for (let i = start; i <= end; i++) {
          parts.push(`${file}.part${i}`);
        }

        return parts;
      }
    </script>

    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        background-color: #121212;
        color: white;
        font-family: Arial, sans-serif;
      }

      #game-container {
        text-align: center;
        width: 100%;
        height: 100%;
      }

      #loading-progress {
        font-size: 18px;
        margin-top: 20px;
        padding: 10px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        display: inline-block;
      }
    </style>
  </head>

  <body>
    <div id="game-container">
      <div id="game"></div>
      <div id="loading-progress">Loading: 0/0</div>
      <div id="first-time">First-time loading may take longer...</div>
    </div>

    <script>
      const parts = getParts(
        window.gameconfig.url,
        window.gameconfig.min,
        window.gameconfig.max,
      );

      const totalParts = parts.length;

      function updateLoadingProgress(loaded) {
        const progressElement =
          document.getElementById("loading-progress");

        progressElement.textContent =
          `Loading: ${loaded}/${totalParts}`;
      }

      updateLoadingProgress(0);

      mergeFiles(parts, updateLoadingProgress)
        .then((gameFile) => {
          document.getElementById("loading-progress").remove();
          document.getElementById("first-time").remove();

          window.EJS_player = "#game";
          window.EJS_core = window.gameconfig.core;
          window.EJS_gameName = window.gameconfig.name;
          window.EJS_color = "#0064ff";
          window.EJS_startOnLoaded = true;

          window.EJS_pathtodata =
            "https://cdn.jsdelivr.net/gh/bubblfan/emu@master/";

          // Pass the named File—not an unnamed blob URL.
          window.EJS_gameUrl = gameFile;

          window.EJS_defaultOptions = {
            vsync: "disabled",
          };

          const script = document.createElement("script");
          script.src =
            "https://cdn.jsdelivr.net/gh/bubblfan/emu@master/loader.js";

          script.onerror = () => {
            console.error("Failed to load EmulatorJS loader.js");
          };

          document.body.appendChild(script);
        })
        .catch((error) => {
          console.error(error);

          const progressElement =
            document.getElementById("loading-progress");

          progressElement.textContent =
            `Error loading game: ${error.message}`;
        });
    </script>
  </body>
</html>
