<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuizForge — Create · Test · Track</title>

<!-- Inter font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">

<style>
/* =========================================================================
   THEME TOKENS
   ========================================================================= */
:root{
  --font: 'Inter', system-ui, -apple-system, sans-serif;
  --radius: 18px;
  --radius-sm: 12px;
  --shadow: 0 8px 30px rgba(0,0,0,.08);
  --shadow-lg: 0 20px 50px rgba(0,0,0,.15);
  --trans: .25s cubic-bezier(.4,0,.2,1);

  --brand: #6366f1;
  --brand-2: #8b5cf6;
  --brand-grad: linear-gradient(135deg,#6366f1,#8b5cf6);
  --ok: #16a34a;
  --err: #dc2626;
  --warn: #d97706;
}
[data-theme="light"]{
  --bg: #f4f5fb;
  --bg-2: #eef0fa;
  --card: #ffffff;
  --card-2: #f7f8fd;
  --text: #1e2235;
  --text-dim: #6b7191;
  --border: #e6e8f2;
  --input: #f7f8fd;
  --hover: #f0f1f9;
}
[data-theme="dark"]{
  --bg: #0f1117;
  --bg-2: #161922;
  --card: #191c26;
  --card-2: #20242f;
  --text: #e8eaf2;
  --text-dim: #9298b0;
  --border: #2a2e3c;
  --input: #20242f;
  --hover: #232735;
  --shadow: 0 8px 30px rgba(0,0,0,.35);
  --shadow-lg: 0 20px 50px rgba(0,0,0,.55);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  line-height:1.55;
  transition:background var(--trans),color var(--trans);
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:14px}
a{color:var(--brand);text-decoration:none}

/* Scrollbar */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:20px}
::-webkit-scrollbar-thumb:hover{background:var(--text-dim)}

/* =========================================================================
   LAYOUT
   ========================================================================= */
.app{display:flex;min-height:100vh}

/* Sidebar */
.sidebar{
  width:250px;flex-shrink:0;
  background:var(--card);
  border-right:1px solid var(--border);
  padding:22px 16px;
  display:flex;flex-direction:column;gap:6px;
  position:sticky;top:0;height:100vh;
  transition:transform var(--trans),background var(--trans);
  z-index:60;
}
.brand{display:flex;align-items:center;gap:11px;padding:6px 10px 20px}
.brand-logo{
  width:40px;height:40px;border-radius:12px;background:var(--brand-grad);
  display:grid;place-items:center;color:#fff;font-size:19px;box-shadow:0 6px 16px rgba(99,102,241,.4)
}
.brand-name{font-weight:800;font-size:19px;letter-spacing:-.5px}
.brand-name span{background:var(--brand-grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.nav-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim);padding:14px 12px 6px;font-weight:600}
.nav-item{
  display:flex;align-items:center;gap:12px;
  padding:11px 12px;border-radius:12px;
  color:var(--text-dim);font-weight:500;font-size:14.5px;
  transition:var(--trans);width:100%;text-align:left;
}
.nav-item i{width:20px;text-align:center;font-size:16px}
.nav-item:hover{background:var(--hover);color:var(--text)}
.nav-item.active{background:var(--brand-grad);color:#fff;box-shadow:0 6px 16px rgba(99,102,241,.35)}
.sidebar-footer{margin-top:auto;padding-top:14px;border-top:1px solid var(--border)}

/* Main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  display:flex;align-items:center;gap:14px;
  padding:16px 26px;border-bottom:1px solid var(--border);
  background:var(--card);position:sticky;top:0;z-index:40;
}
.menu-btn{display:none;font-size:20px;color:var(--text)}
.topbar-title{font-size:19px;font-weight:700;letter-spacing:-.3px}
.topbar-spacer{flex:1}
.icon-btn{
  width:42px;height:42px;border-radius:12px;background:var(--card-2);
  display:grid;place-items:center;font-size:16px;color:var(--text);
  transition:var(--trans);border:1px solid var(--border);
}
.icon-btn:hover{background:var(--hover);transform:translateY(-1px)}

.content{padding:26px;max-width:1200px;width:100%;margin:0 auto;flex:1}
.view{display:none;animation:fadeUp .4s ease}
.view.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* =========================================================================
   COMPONENTS
   ========================================================================= */
.btn{
  display:inline-flex;align-items:center;gap:8px;justify-content:center;
  padding:11px 18px;border-radius:12px;font-weight:600;font-size:14px;
  transition:var(--trans);white-space:nowrap;
}
.btn:active{transform:scale(.96)}
.btn-primary{background:var(--brand-grad);color:#fff;box-shadow:0 6px 16px rgba(99,102,241,.35)}
.btn-primary:hover{box-shadow:0 10px 24px rgba(99,102,241,.45);transform:translateY(-1px)}
.btn-ghost{background:var(--card-2);color:var(--text);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--hover)}
.btn-danger{background:rgba(220,38,38,.12);color:var(--err)}
.btn-danger:hover{background:rgba(220,38,38,.2)}
.btn-sm{padding:8px 13px;font-size:13px;border-radius:10px}
.btn-block{width:100%}

.card{
  background:var(--card);border-radius:var(--radius);
  border:1px solid var(--border);box-shadow:var(--shadow);
  transition:var(--trans);
}

.page-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.page-head h2{font-size:24px;font-weight:800;letter-spacing:-.5px}
.page-head p{color:var(--text-dim);font-size:14px;margin-top:2px}
.head-actions{display:flex;gap:10px;flex-wrap:wrap}

/* Dashboard stats */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-bottom:26px}
.stat{padding:22px;position:relative;overflow:hidden}
.stat .ic{
  width:48px;height:48px;border-radius:14px;display:grid;place-items:center;
  font-size:20px;margin-bottom:14px;color:#fff;
}
.stat .num{font-size:32px;font-weight:800;letter-spacing:-1px}
.stat .lbl{color:var(--text-dim);font-size:13.5px;font-weight:500;margin-top:2px}
.ic-a{background:linear-gradient(135deg,#6366f1,#8b5cf6)}
.ic-b{background:linear-gradient(135deg,#06b6d4,#3b82f6)}
.ic-c{background:linear-gradient(135deg,#f59e0b,#f97316)}
.ic-d{background:linear-gradient(135deg,#10b981,#22c55e)}

.dash-cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.panel{padding:22px}
.panel h3{font-size:16px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:9px}
.panel h3 i{color:var(--brand)}

/* Attempt / list rows */
.row-item{
  display:flex;align-items:center;gap:14px;padding:13px 14px;border-radius:12px;
  transition:var(--trans);
}
.row-item:hover{background:var(--hover)}
.row-item+.row-item{margin-top:4px}
.row-badge{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;font-weight:700;font-size:14px;flex-shrink:0}
.row-main{flex:1;min-width:0}
.row-title{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{font-size:12.5px;color:var(--text-dim)}
.score-pill{font-weight:700;font-size:14px;padding:5px 11px;border-radius:20px}

/* Search + filter bar */
.toolbar{display:flex;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.search-box{
  flex:1;min-width:220px;display:flex;align-items:center;gap:10px;
  background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:0 14px;transition:var(--trans);
}
.search-box:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px rgba(99,102,241,.15)}
.search-box i{color:var(--text-dim)}
.search-box input{flex:1;background:none;border:none;outline:none;padding:12px 0;color:var(--text)}
.select-field{
  background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:0 14px;color:var(--text);outline:none;cursor:pointer;min-width:150px;
}

/* Quiz cards grid */
.quiz-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.quiz-card{padding:20px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.quiz-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.quiz-card .accent{position:absolute;top:0;left:0;right:0;height:5px;background:var(--brand-grad)}
.qc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.qc-cat{
  font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
  padding:5px 10px;border-radius:20px;background:rgba(99,102,241,.12);color:var(--brand);
}
.qc-title{font-size:17px;font-weight:700;letter-spacing:-.3px;line-height:1.3}
.qc-desc{font-size:13.5px;color:var(--text-dim);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:38px}
.qc-meta{display:flex;gap:16px;font-size:12.5px;color:var(--text-dim);flex-wrap:wrap}
.qc-meta span{display:flex;align-items:center;gap:6px}
.qc-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.qc-actions .btn{flex:1}
.qc-menu{display:flex;gap:6px}
.mini-btn{
  width:34px;height:34px;border-radius:9px;background:var(--card-2);
  display:grid;place-items:center;font-size:13px;color:var(--text-dim);
  transition:var(--trans);border:1px solid var(--border);
}
.mini-btn:hover{background:var(--hover);color:var(--text)}

/* Empty state */
.empty{text-align:center;padding:70px 20px;color:var(--text-dim)}
.empty i{font-size:52px;margin-bottom:16px;opacity:.4}
.empty h3{font-size:19px;color:var(--text);margin-bottom:8px}
.empty p{margin-bottom:20px}

/* =========================================================================
   FORMS (creator)
   ========================================================================= */
.form-card{padding:24px;margin-bottom:20px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:7px;color:var(--text)}
.field .hint{font-weight:400;color:var(--text-dim);font-size:12px}
.field input,.field textarea,.field select{
  width:100%;padding:12px 14px;border-radius:11px;border:1px solid var(--border);
  background:var(--input);color:var(--text);outline:none;transition:var(--trans);
}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(99,102,241,.15)}
.field textarea{resize:vertical;min-height:70px}

.q-block{padding:20px;margin-bottom:16px;border-left:4px solid var(--brand)}
.q-block-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px}
.q-num{font-weight:700;font-size:15px;display:flex;align-items:center;gap:9px}
.q-num .dot{width:26px;height:26px;border-radius:50%;background:var(--brand-grad);color:#fff;display:grid;place-items:center;font-size:12px}

.opt-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.opt-row input[type=radio]{width:20px;height:20px;accent-color:var(--brand);flex-shrink:0;cursor:pointer}
.opt-row input[type=text]{flex:1}
.opt-row .rm{width:36px;height:36px;flex-shrink:0}
.tf-choice{display:flex;gap:10px}
.tf-choice label{
  flex:1;display:flex;align-items:center;justify-content:center;gap:8px;
  padding:12px;border-radius:11px;border:2px solid var(--border);cursor:pointer;
  font-weight:600;transition:var(--trans);
}
.tf-choice input{display:none}
.tf-choice input:checked+span{color:var(--brand)}
.tf-choice label:has(input:checked){border-color:var(--brand);background:rgba(99,102,241,.08)}

/* =========================================================================
   QUIZ PLAYER
   ========================================================================= */
.player-wrap{max-width:760px;margin:0 auto}
.player-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:16px}
.player-head h2{font-size:20px;font-weight:700}
.timer{
  display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;
  padding:8px 15px;border-radius:12px;background:var(--card);border:1px solid var(--border);
}
.timer.warn{color:var(--err);border-color:var(--err);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.55}}
.progress-wrap{margin-bottom:22px}
.progress-info{display:flex;justify-content:space-between;font-size:13px;color:var(--text-dim);margin-bottom:8px;font-weight:500}
.progress-bar{height:10px;border-radius:20px;background:var(--card-2);overflow:hidden;border:1px solid var(--border)}
.progress-fill{height:100%;background:var(--brand-grad);border-radius:20px;transition:width .4s cubic-bezier(.4,0,.2,1);width:0}

.question-card{padding:30px;margin-bottom:22px;animation:fadeUp .35s ease}
.q-type-tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--brand);margin-bottom:12px}
.q-text{font-size:21px;font-weight:700;line-height:1.4;margin-bottom:24px;letter-spacing:-.3px}
.answers{display:flex;flex-direction:column;gap:12px}
.answer-opt{
  display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:14px;
  border:2px solid var(--border);background:var(--card-2);transition:var(--trans);cursor:pointer;font-size:15px;font-weight:500;
}
.answer-opt:hover{border-color:var(--brand);transform:translateX(4px)}
.answer-opt.selected{border-color:var(--brand);background:rgba(99,102,241,.1)}
.answer-opt .letter{
  width:32px;height:32px;border-radius:9px;flex-shrink:0;display:grid;place-items:center;
  font-weight:700;background:var(--card);border:1px solid var(--border);transition:var(--trans);
}
.answer-opt.selected .letter{background:var(--brand-grad);color:#fff;border-color:transparent}
.short-answer input{width:100%;padding:16px 18px;font-size:16px;border-radius:14px;border:2px solid var(--border);background:var(--card-2);color:var(--text);outline:none}
.short-answer input:focus{border-color:var(--brand)}

.player-nav{display:flex;justify-content:space-between;gap:12px}
.player-nav .btn{min-width:120px}

/* =========================================================================
   RESULTS
   ========================================================================= */
.results-wrap{max-width:760px;margin:0 auto}
.result-hero{padding:40px;text-align:center;margin-bottom:24px}
.score-ring{
  width:170px;height:170px;border-radius:50%;margin:0 auto 22px;
  display:grid;place-items:center;position:relative;
}
.score-ring .inner{
  width:132px;height:132px;border-radius:50%;background:var(--card);
  display:grid;place-items:center;flex-direction:column;
}
.score-ring .pct{font-size:38px;font-weight:800;letter-spacing:-1px}
.score-ring .frac{font-size:13px;color:var(--text-dim);font-weight:500}
.result-msg{font-size:24px;font-weight:800;margin-bottom:6px;letter-spacing:-.5px}
.result-sub{color:var(--text-dim);margin-bottom:26px}
.result-summary{display:flex;justify-content:center;gap:30px;flex-wrap:wrap;margin-bottom:8px}
.rsum{text-align:center}
.rsum .n{font-size:24px;font-weight:800}
.rsum .l{font-size:12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em;font-weight:600}

.review-item{padding:20px;margin-bottom:14px}
.review-item.correct{border-left:4px solid var(--ok)}
.review-item.wrong{border-left:4px solid var(--err)}
.ri-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
.ri-icon{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;color:#fff;font-size:13px}
.ri-icon.correct{background:var(--ok)}
.ri-icon.wrong{background:var(--err)}
.ri-q{font-weight:700;font-size:15.5px;line-height:1.4}
.ri-ans{font-size:14px;margin:5px 0;padding:9px 13px;border-radius:9px}
.ri-ans.yours{background:rgba(220,38,38,.1);color:var(--err)}
.ri-ans.yours.ok{background:rgba(22,163,74,.1);color:var(--ok)}
.ri-ans.right{background:rgba(22,163,74,.1);color:var(--ok)}
.ri-ans .lbl{font-weight:700;font-size:11px;text-transform:uppercase;margin-right:6px;opacity:.8}
.ri-expl{font-size:13.5px;color:var(--text-dim);background:var(--card-2);padding:12px 14px;border-radius:10px;margin-top:8px;line-height:1.55}
.ri-expl i{color:var(--warn);margin-right:6px}

/* =========================================================================
   MODAL
   ========================================================================= */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);
  display:none;align-items:center;justify-content:center;z-index:100;padding:20px;
}
.modal-overlay.show{display:flex;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--card);border-radius:20px;max-width:480px;width:100%;
  padding:28px;box-shadow:var(--shadow-lg);animation:pop .3s cubic-bezier(.4,0,.2,1);max-height:88vh;overflow:auto;
}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
.modal h3{font-size:19px;font-weight:800;margin-bottom:10px}
.modal p{color:var(--text-dim);font-size:14px;margin-bottom:20px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

/* Drop zone */
.drop-zone{
  border:2px dashed var(--border);border-radius:16px;padding:36px 20px;text-align:center;
  transition:var(--trans);cursor:pointer;color:var(--text-dim);
}
.drop-zone:hover,.drop-zone.drag{border-color:var(--brand);background:rgba(99,102,241,.06);color:var(--brand)}
.drop-zone i{font-size:40px;margin-bottom:12px}

/* Toast */
.toast-wrap{position:fixed;bottom:24px;right:24px;z-index:200;display:flex;flex-direction:column;gap:10px}
.toast{
  background:var(--card);border:1px solid var(--border);border-left:4px solid var(--brand);
  border-radius:12px;padding:14px 18px;box-shadow:var(--shadow-lg);
  display:flex;align-items:center;gap:12px;font-size:14px;font-weight:500;min-width:240px;max-width:340px;
  animation:slideIn .3s cubic-bezier(.4,0,.2,1);
}
.toast.ok{border-left-color:var(--ok)}.toast.ok i{color:var(--ok)}
.toast.err{border-left-color:var(--err)}.toast.err i{color:var(--err)}
.toast.info i{color:var(--brand)}
@keyframes slideIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}

.settings-row{display:flex;align-items:center;justify-content:space-between;padding:16px 0;border-bottom:1px solid var(--border)}
.settings-row:last-child{border:none}
.settings-row .info h4{font-size:15px;font-weight:600}
.settings-row .info p{font-size:13px;color:var(--text-dim)}
/* Toggle switch */
.switch{position:relative;width:48px;height:27px;flex-shrink:0}
.switch input{display:none}
.switch .slider{position:absolute;inset:0;background:var(--border);border-radius:20px;transition:var(--trans)}
.switch .slider::before{content:"";position:absolute;width:21px;height:21px;left:3px;top:3px;background:#fff;border-radius:50%;transition:var(--trans)}
.switch input:checked+.slider{background:var(--brand)}
.switch input:checked+.slider::before{transform:translateX(21px)}

/* Overlay for mobile sidebar */
.backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:55}
.backdrop.show{display:block}

/* =========================================================================
   RESPONSIVE
   ========================================================================= */
@media(max-width:860px){
  .dash-cols{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
}
@media(max-width:720px){
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .menu-btn{display:block}
  .content{padding:18px}
  .topbar{padding:14px 18px}
  .q-text{font-size:18px}
  .result-hero{padding:28px 18px}
  .player-nav .btn{min-width:0;flex:1}
}
</style>
</head>
<body>
<div class="app">

  <!-- ===================== SIDEBAR ===================== -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo"><i class="fa-solid fa-bolt"></i></div>
      <div class="brand-name">Quiz<span>Forge</span></div>
    </div>

    <button class="nav-item active" data-view="dashboard"><i class="fa-solid fa-gauge-high"></i> Dashboard</button>
    <button class="nav-item" data-view="quizzes"><i class="fa-solid fa-layer-group"></i> My Quizzes</button>
    <button class="nav-item" data-view="creator" data-new="1"><i class="fa-solid fa-circle-plus"></i> Create Quiz</button>
    <button class="nav-item" data-view="history"><i class="fa-solid fa-clock-rotate-left"></i> History</button>

    <div class="nav-label">Data</div>
    <button class="nav-item" id="nav-import"><i class="fa-solid fa-file-import"></i> Import</button>
    <button class="nav-item" id="nav-export-all"><i class="fa-solid fa-cloud-arrow-down"></i> Backup All</button>

    <div class="sidebar-footer">
      <button class="nav-item" id="nav-theme"><i class="fa-solid fa-moon"></i> <span id="theme-label">Dark Mode</span></button>
    </div>
  </aside>
  <div class="backdrop" id="backdrop"></div>

  <!-- ===================== MAIN ===================== -->
  <main class="main">
    <header class="topbar">
      <button class="menu-btn" id="menu-btn"><i class="fa-solid fa-bars"></i></button>
      <div class="topbar-title" id="topbar-title">Dashboard</div>
      <div class="topbar-spacer"></div>
      <button class="icon-btn" id="quick-create" title="Create quiz"><i class="fa-solid fa-plus"></i></button>
      <button class="icon-btn" id="quick-theme" title="Toggle theme"><i class="fa-solid fa-moon"></i></button>
    </header>

    <div class="content">

      <!-- ============ DASHBOARD ============ -->
      <section class="view active" id="view-dashboard"></section>

      <!-- ============ QUIZZES ============ -->
      <section class="view" id="view-quizzes"></section>

      <!-- ============ CREATOR ============ -->
      <section class="view" id="view-creator"></section>

      <!-- ============ PLAYER ============ -->
      <section class="view" id="view-player"></section>

      <!-- ============ RESULTS ============ -->
      <section class="view" id="view-results"></section>

      <!-- ============ HISTORY ============ -->
      <section class="view" id="view-history"></section>

    </div>
  </main>
</div>

<!-- Modal + toast containers -->
<div class="modal-overlay" id="modal-overlay"><div class="modal" id="modal-box"></div></div>
<div class="toast-wrap" id="toast-wrap"></div>
<input type="file" id="file-input" accept="application/json,.json" style="display:none" multiple>

<script>
/* =====================================================================
   QuizForge — vanilla JS app
   Data persisted in LocalStorage. No backend.
   ===================================================================== */
'use strict';

/* ---------- Storage keys & helpers ---------- */
const LS_QUIZZES = 'qf_quizzes';
const LS_HISTORY = 'qf_history';
const LS_SETTINGS = 'qf_settings';

const uid = () => 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

function load(key, fallback) {
  try { const v = JSON.parse(localStorage.getItem(key)); return v ?? fallback; }
  catch { return fallback; }
}
function save(key, val) { localStorage.setItem(key, JSON.stringify(val)); }

/* ---------- App state ---------- */
let quizzes  = load(LS_QUIZZES, null);
let history  = load(LS_HISTORY, []);
let settings = load(LS_SETTINGS, { theme: 'light' });

/* Player runtime state */
let player = null;

/* ---------- Sample data (only seeded on first run) ---------- */
function sampleQuizzes() {
  const now = Date.now();
  return [
    {
      id: uid(), title: 'World Capitals', description: 'Test your knowledge of capital cities around the globe.',
      subject: 'Geography', category: 'General Knowledge', createdAt: now, updatedAt: now,
      settings: { timer: 0, shuffleQuestions: true, shuffleAnswers: true },
      questions: [
        { id: uid(), type: 'mc', text: 'What is the capital of Australia?', options: ['Sydney','Melbourne','Canberra','Perth'], correct: 2, explanation: 'Canberra was purpose-built as the capital, chosen as a compromise between rivals Sydney and Melbourne.' },
        { id: uid(), type: 'mc', text: 'What is the capital of Canada?', options: ['Toronto','Ottawa','Vancouver','Montreal'], correct: 1, explanation: 'Ottawa has been the capital of Canada since 1857.' },
        { id: uid(), type: 'tf', text: 'Cairo is the capital of Egypt.', correct: true, explanation: 'Cairo is indeed Egypt\u2019s capital and largest city.' },
        { id: uid(), type: 'short', text: 'What is the capital of Japan?', correct: 'Tokyo', explanation: 'Tokyo became the capital in 1868, replacing Kyoto.' }
      ]
    },
    {
      id: uid(), title: 'JavaScript Basics', description: 'Fundamental concepts every JS developer should know.',
      subject: 'Programming', category: 'Web Development', createdAt: now - 86400000, updatedAt: now - 86400000,
      settings: { timer: 5, shuffleQuestions: false, shuffleAnswers: true },
      questions: [
        { id: uid(), type: 'mc', text: 'Which keyword declares a block-scoped variable?', options: ['var','let','function','global'], correct: 1, explanation: '"let" (and "const") are block-scoped, while "var" is function-scoped.' },
        { id: uid(), type: 'tf', text: 'In JavaScript, "===" checks value and type.', correct: true, explanation: 'The strict equality operator compares both value and type without coercion.' },
        { id: uid(), type: 'short', text: 'What method converts a JSON string into an object?', correct: 'JSON.parse', explanation: 'JSON.parse() parses a JSON string; JSON.stringify() does the reverse.' }
      ]
    },
    {
      id: uid(), title: 'Human Body', description: 'Basic anatomy and biology questions.',
      subject: 'Science', category: 'Biology', createdAt: now - 172800000, updatedAt: now - 172800000,
      settings: { timer: 0, shuffleQuestions: true, shuffleAnswers: false },
      questions: [
        { id: uid(), type: 'mc', text: 'How many bones are in the adult human body?', options: ['186','206','226','246'], correct: 1, explanation: 'Adults have 206 bones; babies are born with around 270 that fuse over time.' },
        { id: uid(), type: 'tf', text: 'The heart has four chambers.', correct: true, explanation: 'Two atria and two ventricles make up the four chambers.' }
      ]
    }
  ];
}

if (quizzes === null) { quizzes = sampleQuizzes(); save(LS_QUIZZES, quizzes); }

/* ---------- Persistence wrappers ---------- */
const persistQuizzes = () => save(LS_QUIZZES, quizzes);
const persistHistory = () => save(LS_HISTORY, history);
const persistSettings = () => save(LS_SETTINGS, settings);

/* =====================================================================
   TOAST + MODAL
   ===================================================================== */
function toast(msg, type = 'info') {
  const wrap = $('#toast-wrap');
  const icons = { ok: 'fa-circle-check', err: 'fa-circle-exclamation', info: 'fa-circle-info' };
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<i class="fa-solid ${icons[type] || icons.info}"></i><span>${esc(msg)}</span>`;
  wrap.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translateX(40px)'; el.style.transition = '.3s'; setTimeout(() => el.remove(), 300); }, 3200);
}

function openModal(html) {
  $('#modal-box').innerHTML = html;
  $('#modal-overlay').classList.add('show');
}
function closeModal() { $('#modal-overlay').classList.remove('show'); }
$('#modal-overlay').addEventListener('click', e => { if (e.target.id === 'modal-overlay') closeModal(); });

/* Generic confirm dialog returning a promise */
function confirmDialog({ title, message, confirmText = 'Confirm', danger = false }) {
  return new Promise(resolve => {
    openModal(`
      <h3>${esc(title)}</h3>
      <p>${esc(message)}</p>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="cd-cancel">Cancel</button>
        <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" id="cd-ok">${esc(confirmText)}</button>
      </div>`);
    $('#cd-cancel').onclick = () => { closeModal(); resolve(false); };
    $('#cd-ok').onclick = () => { closeModal(); resolve(true); };
  });
}

/* =====================================================================
   NAVIGATION / VIEW ROUTING
   ===================================================================== */
const VIEW_TITLES = {
  dashboard: 'Dashboard', quizzes: 'My Quizzes', creator: 'Create Quiz',
  player: 'Take Quiz', results: 'Results', history: 'History'
};

function showView(name) {
  $$('.view').forEach(v => v.classList.remove('active'));
  $(`#view-${name}`).classList.add('active');
  $$('.nav-item[data-view]').forEach(n => n.classList.toggle('active', n.dataset.view === name));
  $('#topbar-title').textContent = VIEW_TITLES[name] || 'QuizForge';
  closeSidebar();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

$$('.nav-item[data-view]').forEach(btn => {
  btn.addEventListener('click', () => {
    const view = btn.dataset.view;
    if (view === 'creator' && btn.dataset.new) { openCreator(null); }
    if (view === 'dashboard') renderDashboard();
    if (view === 'quizzes') renderQuizzes();
    if (view === 'history') renderHistory();
    showView(view);
  });
});

/* Sidebar mobile */
function openSidebar()  { $('#sidebar').classList.add('open'); $('#backdrop').classList.add('show'); }
function closeSidebar() { $('#sidebar').classList.remove('open'); $('#backdrop').classList.remove('show'); }
$('#menu-btn').addEventListener('click', openSidebar);
$('#backdrop').addEventListener('click', closeSidebar);

/* =====================================================================
   THEME
   ===================================================================== */
function applyTheme() {
  document.documentElement.setAttribute('data-theme', settings.theme);
  const dark = settings.theme === 'dark';
  $('#theme-label').textContent = dark ? 'Light Mode' : 'Dark Mode';
  $('#nav-theme').querySelector('i').className = dark ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
  $('#quick-theme').querySelector('i').className = dark ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
}
function toggleTheme() { settings.theme = settings.theme === 'dark' ? 'light' : 'dark'; persistSettings(); applyTheme(); }
$('#nav-theme').addEventListener('click', toggleTheme);
$('#quick-theme').addEventListener('click', toggleTheme);
$('#quick-create').addEventListener('click', () => { openCreator(null); showView('creator'); });

/* =====================================================================
   DASHBOARD
   ===================================================================== */
function totalQuestions() { return quizzes.reduce((s, q) => s + q.questions.length, 0); }

function renderDashboard() {
  const totalQ = quizzes.length;
  const totalQuest = totalQuestions();
  const attempts = history.length;

  // Best score per quiz
  const bestByQuiz = {};
  history.forEach(h => {
    if (!(h.quizId in bestByQuiz) || h.percentage > bestByQuiz[h.quizId].percentage) bestByQuiz[h.quizId] = h;
  });
  const bestList = Object.values(bestByQuiz).sort((a, b) => b.percentage - a.percentage).slice(0, 5);
  const recent = [...history].reverse().slice(0, 5);

  const el = $('#view-dashboard');
  el.innerHTML = `
    <div class="page-head">
      <div><h2>Welcome back \u{1F44B}</h2><p>Your quiz activity at a glance.</p></div>
      <div class="head-actions">
        <button class="btn btn-primary" onclick="openCreator(null);showView('creator')"><i class="fa-solid fa-plus"></i> New Quiz</button>
      </div>
    </div>

    <div class="stats-grid">
      <div class="card stat"><div class="ic ic-a"><i class="fa-solid fa-layer-group"></i></div><div class="num">${totalQ}</div><div class="lbl">Quizzes Created</div></div>
      <div class="card stat"><div class="ic ic-b"><i class="fa-solid fa-circle-question"></i></div><div class="num">${totalQuest}</div><div class="lbl">Total Questions</div></div>
      <div class="card stat"><div class="ic ic-c"><i class="fa-solid fa-flag-checkered"></i></div><div class="num">${attempts}</div><div class="lbl">Quiz Attempts</div></div>
      <div class="card stat"><div class="ic ic-d"><i class="fa-solid fa-trophy"></i></div><div class="num">${bestList[0] ? bestList[0].percentage + '%' : '\u2013'}</div><div class="lbl">Top Score</div></div>
    </div>

    <div class="dash-cols">
      <div class="card panel">
        <h3><i class="fa-solid fa-clock-rotate-left"></i> Recent Attempts</h3>
        <div>${recent.length ? recent.map(attemptRow).join('') : emptyMini('No attempts yet','Take a quiz to see it here.')}</div>
      </div>
      <div class="card panel">
        <h3><i class="fa-solid fa-medal"></i> Best Scores</h3>
        <div>${bestList.length ? bestList.map(bestRow).join('') : emptyMini('No scores yet','Complete a quiz to record a score.')}</div>
      </div>
    </div>`;
}

function scoreColor(p) { return p >= 80 ? 'var(--ok)' : p >= 50 ? 'var(--warn)' : 'var(--err)'; }
function scoreBg(p) { return p >= 80 ? 'rgba(22,163,74,.14)' : p >= 50 ? 'rgba(217,119,6,.14)' : 'rgba(220,38,38,.14)'; }
function timeAgo(ts) {
  const d = Date.now() - ts, m = 60000, h = 3600000, day = 86400000;
  if (d < m) return 'just now';
  if (d < h) return Math.floor(d / m) + 'm ago';
  if (d < day) return Math.floor(d / h) + 'h ago';
  if (d < day * 7) return Math.floor(d / day) + 'd ago';
  return new Date(ts).toLocaleDateString();
}

function attemptRow(h) {
  const c = scoreColor(h.percentage);
  return `<div class="row-item">
    <div class="row-badge" style="background:${scoreBg(h.percentage)};color:${c}">${h.percentage}%</div>
    <div class="row-main"><div class="row-title">${esc(h.title)}</div><div class="row-sub">${h.score}/${h.total} correct \u00b7 ${timeAgo(h.date)}</div></div>
    <span class="score-pill" style="background:${scoreBg(h.percentage)};color:${c}">${h.score}/${h.total}</span>
  </div>`;
}
function bestRow(h) {
  const c = scoreColor(h.percentage);
  return `<div class="row-item">
    <div class="row-badge" style="background:${scoreBg(h.percentage)};color:${c}"><i class="fa-solid fa-star"></i></div>
    <div class="row-main"><div class="row-title">${esc(h.title)}</div><div class="row-sub">Best of ${history.filter(x=>x.quizId===h.quizId).length} attempt(s)</div></div>
    <span class="score-pill" style="background:${scoreBg(h.percentage)};color:${c}">${h.percentage}%</span>
  </div>`;
}
function emptyMini(t, s) { return `<div style="text-align:center;padding:28px 10px;color:var(--text-dim)"><i class="fa-regular fa-folder-open" style="font-size:30px;opacity:.4;margin-bottom:10px;display:block"></i><div style="font-weight:600;color:var(--text)">${t}</div><div style="font-size:13px">${s}</div></div>`; }

/* =====================================================================
   QUIZZES LIST
   ===================================================================== */
let quizFilter = { search: '', subject: 'all' };

function renderQuizzes() {
  const subjects = ['all', ...new Set(quizzes.map(q => q.subject).filter(Boolean))];
  const el = $('#view-quizzes');
  el.innerHTML = `
    <div class="page-head">
      <div><h2>My Quizzes</h2><p>${quizzes.length} quiz${quizzes.length===1?'':'zes'} \u00b7 ${totalQuestions()} questions</p></div>
      <div class="head-actions">
        <button class="btn btn-ghost" onclick="triggerImport()"><i class="fa-solid fa-file-import"></i> Import</button>
        <button class="btn btn-primary" onclick="openCreator(null);showView('creator')"><i class="fa-solid fa-plus"></i> New Quiz</button>
      </div>
    </div>
    <div class="toolbar">
      <div class="search-box"><i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="quiz-search" placeholder="Search quizzes, subjects, categories..." value="${esc(quizFilter.search)}">
      </div>
      <select class="select-field" id="subject-filter">
        ${subjects.map(s => `<option value="${esc(s)}" ${quizFilter.subject===s?'selected':''}>${s==='all'?'All Subjects':esc(s)}</option>`).join('')}
      </select>
    </div>
    <div id="quiz-grid-wrap"></div>`;

  $('#quiz-search').addEventListener('input', e => { quizFilter.search = e.target.value; drawQuizGrid(); });
  $('#subject-filter').addEventListener('change', e => { quizFilter.subject = e.target.value; drawQuizGrid(); });
  drawQuizGrid();
}

function drawQuizGrid() {
  const term = quizFilter.search.trim().toLowerCase();
  let list = quizzes.filter(q => {
    if (quizFilter.subject !== 'all' && q.subject !== quizFilter.subject) return false;
    if (!term) return true;
    return [q.title, q.description, q.subject, q.category].some(f => (f || '').toLowerCase().includes(term));
  });
  list = list.sort((a, b) => b.updatedAt - a.updatedAt);

  const wrap = $('#quiz-grid-wrap');
  if (!list.length) {
    wrap.innerHTML = `<div class="empty"><i class="fa-solid fa-inbox"></i><h3>${quizzes.length? 'No matching quizzes':'No quizzes yet'}</h3><p>${quizzes.length?'Try a different search or filter.':'Create your first quiz to get started.'}</p><button class="btn btn-primary" onclick="openCreator(null);showView('creator')"><i class="fa-solid fa-plus"></i> Create Quiz</button></div>`;
    return;
  }
  wrap.innerHTML = `<div class="quiz-grid">${list.map(quizCard).join('')}</div>`;
}

function quizCard(q) {
  return `<article class="card quiz-card">
    <div class="accent"></div>
    <div class="qc-top">
      <span class="qc-cat">${esc(q.subject || 'General')}</span>
      <div class="qc-menu">
        <button class="mini-btn" title="Edit" onclick="openCreator('${q.id}');showView('creator')"><i class="fa-solid fa-pen"></i></button>
        <button class="mini-btn" title="Duplicate" onclick="duplicateQuiz('${q.id}')"><i class="fa-solid fa-copy"></i></button>
        <button class="mini-btn" title="Export" onclick="exportQuiz('${q.id}')"><i class="fa-solid fa-download"></i></button>
        <button class="mini-btn" title="Delete" onclick="deleteQuiz('${q.id}')"><i class="fa-solid fa-trash"></i></button>
      </div>
    </div>
    <div>
      <div class="qc-title">${esc(q.title)}</div>
      <div class="qc-desc">${esc(q.description || 'No description provided.')}</div>
    </div>
    <div class="qc-meta">
      <span><i class="fa-solid fa-circle-question"></i> ${q.questions.length} Q</span>
      <span><i class="fa-solid fa-tag"></i> ${esc(q.category || '\u2014')}</span>
      ${q.settings && q.settings.timer ? `<span><i class="fa-solid fa-stopwatch"></i> ${q.settings.timer}m</span>` : ''}
    </div>
    <div class="qc-actions">
      <button class="btn btn-primary btn-sm" ${q.questions.length?'':'disabled style=opacity:.5'} onclick="startQuiz('${q.id}')"><i class="fa-solid fa-play"></i> Start</button>
      <button class="btn btn-ghost btn-sm" onclick="renameQuiz('${q.id}')"><i class="fa-solid fa-i-cursor"></i> Rename</button>
    </div>
  </article>`;
}

/* ---------- Quiz CRUD actions ---------- */
function getQuiz(id) { return quizzes.find(q => q.id === id); }

async function deleteQuiz(id) {
  const q = getQuiz(id); if (!q) return;
  const ok = await confirmDialog({ title: 'Delete quiz?', message: `"${q.title}" and its ${q.questions.length} questions will be permanently removed.`, confirmText: 'Delete', danger: true });
  if (!ok) return;
  quizzes = quizzes.filter(x => x.id !== id); persistQuizzes();
  drawQuizGrid(); renderDashboard();
  toast('Quiz deleted', 'ok');
}

function duplicateQuiz(id) {
  const q = getQuiz(id); if (!q) return;
  const copy = JSON.parse(JSON.stringify(q));
  copy.id = uid(); copy.title = q.title + ' (Copy)';
  copy.createdAt = copy.updatedAt = Date.now();
  copy.questions.forEach(qq => qq.id = uid());
  quizzes.unshift(copy); persistQuizzes();
  drawQuizGrid(); toast('Quiz duplicated', 'ok');
}

function renameQuiz(id) {
  const q = getQuiz(id); if (!q) return;
  openModal(`
    <h3>Rename Quiz</h3>
    <div class="field"><label>Quiz title</label><input type="text" id="rn-title" value="${esc(q.title)}"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" id="rn-save">Save</button>
    </div>`);
  const input = $('#rn-title'); input.focus(); input.select();
  $('#rn-save').onclick = () => {
    const v = input.value.trim(); if (!v) { toast('Title cannot be empty', 'err'); return; }
    q.title = v; q.updatedAt = Date.now(); persistQuizzes(); closeModal();
    drawQuizGrid(); toast('Renamed', 'ok');
  };
}

/* =====================================================================
   CREATOR
   ===================================================================== */
let draft = null; // working quiz object while editing

function blankQuestion(type = 'mc') {
  if (type === 'mc')   return { id: uid(), type, text: '', options: ['', '', '', ''], correct: 0, explanation: '' };
  if (type === 'tf')   return { id: uid(), type, text: '', correct: true, explanation: '' };
  return { id: uid(), type: 'short', text: '', correct: '', explanation: '' };
}

function openCreator(id) {
  if (id) {
    draft = JSON.parse(JSON.stringify(getQuiz(id)));
  } else {
    draft = { id: uid(), title: '', description: '', subject: '', category: '',
      createdAt: Date.now(), updatedAt: Date.now(),
      settings: { timer: 0, shuffleQuestions: false, shuffleAnswers: false },
      questions: [blankQuestion('mc')] };
  }
  renderCreator();
}

function renderCreator() {
  const el = $('#view-creator');
  const isEdit = !!getQuiz(draft.id);
  el.innerHTML = `
    <div class="page-head">
      <div><h2>${isEdit ? 'Edit Quiz' : 'Create Quiz'}</h2><p>Build your quiz with unlimited questions.</p></div>
      <div class="head-actions">
        <button class="btn btn-ghost" onclick="renderQuizzes();showView('quizzes')"><i class="fa-solid fa-xmark"></i> Cancel</button>
        <button class="btn btn-primary" id="save-quiz"><i class="fa-solid fa-floppy-disk"></i> Save Quiz</button>
      </div>
    </div>

    <div class="card form-card">
      <div class="form-grid">
        <div class="field"><label>Quiz Title *</label><input type="text" id="c-title" placeholder="e.g. World Capitals" value="${esc(draft.title)}"></div>
        <div class="field"><label>Subject</label><input type="text" id="c-subject" placeholder="e.g. Geography" value="${esc(draft.subject)}"></div>
      </div>
      <div class="form-grid">
        <div class="field"><label>Category</label><input type="text" id="c-category" placeholder="e.g. General Knowledge" value="${esc(draft.category)}"></div>
        <div class="field"><label>Timer <span class="hint">(minutes, 0 = off)</span></label><input type="number" min="0" id="c-timer" value="${draft.settings.timer||0}"></div>
      </div>
      <div class="field"><label>Description</label><textarea id="c-desc" placeholder="Short description of the quiz...">${esc(draft.description)}</textarea></div>
      <div style="display:flex;gap:22px;flex-wrap:wrap">
        <label style="display:flex;align-items:center;gap:9px;font-size:14px;font-weight:500;cursor:pointer"><input type="checkbox" id="c-shq" ${draft.settings.shuffleQuestions?'checked':''} style="width:18px;height:18px;accent-color:var(--brand)"> Shuffle questions</label>
        <label style="display:flex;align-items:center;gap:9px;font-size:14px;font-weight:500;cursor:pointer"><input type="checkbox" id="c-sha" ${draft.settings.shuffleAnswers?'checked':''} style="width:18px;height:18px;accent-color:var(--brand)"> Shuffle answers</label>
      </div>
    </div>

    <div id="questions-list"></div>

    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:4px">
      <button class="btn btn-ghost" onclick="addQuestion('mc')"><i class="fa-solid fa-list-ul"></i> Add Multiple Choice</button>
      <button class="btn btn-ghost" onclick="addQuestion('tf')"><i class="fa-solid fa-toggle-on"></i> Add True/False</button>
      <button class="btn btn-ghost" onclick="addQuestion('short')"><i class="fa-solid fa-pen-nib"></i> Add Short Answer</button>
    </div>
    <div style="height:20px"></div>`;

  // Bind top-level field syncing
  const sync = () => {
    draft.title = $('#c-title').value;
    draft.subject = $('#c-subject').value;
    draft.category = $('#c-category').value;
    draft.description = $('#c-desc').value;
    draft.settings.timer = Math.max(0, parseInt($('#c-timer').value) || 0);
    draft.settings.shuffleQuestions = $('#c-shq').checked;
    draft.settings.shuffleAnswers = $('#c-sha').checked;
  };
  ['c-title','c-subject','c-category','c-desc','c-timer'].forEach(id => $('#'+id).addEventListener('input', sync));
  ['c-shq','c-sha'].forEach(id => $('#'+id).addEventListener('change', sync));
  $('#save-quiz').addEventListener('click', () => { sync(); saveDraft(); });

  renderQuestions();
}

function renderQuestions() {
  const wrap = $('#questions-list');
  wrap.innerHTML = draft.questions.map((q, i) => questionEditor(q, i)).join('');
  bindQuestionEditors();
}

function questionEditor(q, i) {
  const typeName = { mc: 'Multiple Choice', tf: 'True / False', short: 'Short Answer' }[q.type];
  let body = '';
  if (q.type === 'mc') {
    body = `<div class="field"><label>Answer options <span class="hint">(select the correct one)</span></label>
      <div id="opts-${q.id}">${q.options.map((o, oi) => `
        <div class="opt-row">
          <input type="radio" name="correct-${q.id}" value="${oi}" ${q.correct===oi?'checked':''} data-q="${q.id}" class="mc-correct">
          <input type="text" class="mc-opt" data-q="${q.id}" data-oi="${oi}" placeholder="Option ${oi+1}" value="${esc(o)}">
          <button class="mini-btn rm" onclick="removeOption('${q.id}',${oi})" ${q.options.length<=2?'style=visibility:hidden':''}><i class="fa-solid fa-xmark"></i></button>
        </div>`).join('')}</div>
      <button class="btn btn-ghost btn-sm" onclick="addOption('${q.id}')" style="margin-top:6px"><i class="fa-solid fa-plus"></i> Add option</button>
    </div>`;
  } else if (q.type === 'tf') {
    body = `<div class="field"><label>Correct answer</label>
      <div class="tf-choice">
        <label><input type="radio" name="tf-${q.id}" class="tf-correct" data-q="${q.id}" value="true" ${q.correct===true?'checked':''}><span><i class="fa-solid fa-check"></i> True</span></label>
        <label><input type="radio" name="tf-${q.id}" class="tf-correct" data-q="${q.id}" value="false" ${q.correct===false?'checked':''}><span><i class="fa-solid fa-xmark"></i> False</span></label>
      </div>
    </div>`;
  } else {
    body = `<div class="field"><label>Correct answer <span class="hint">(case-insensitive)</span></label>
      <input type="text" class="short-correct" data-q="${q.id}" placeholder="Expected answer" value="${esc(q.correct)}"></div>`;
  }

  return `<div class="card q-block">
    <div class="q-block-head">
      <div class="q-num"><span class="dot">${i+1}</span> ${typeName}</div>
      <div style="display:flex;gap:6px">
        <button class="mini-btn" title="Move up" onclick="moveQuestion('${q.id}',-1)" ${i===0?'disabled style=opacity:.35':''}><i class="fa-solid fa-arrow-up"></i></button>
        <button class="mini-btn" title="Move down" onclick="moveQuestion('${q.id}',1)" ${i===draft.questions.length-1?'disabled style=opacity:.35':''}><i class="fa-solid fa-arrow-down"></i></button>
        <button class="mini-btn" title="Duplicate" onclick="dupQuestion('${q.id}')"><i class="fa-solid fa-copy"></i></button>
        <button class="mini-btn" title="Delete" onclick="delQuestion('${q.id}')"><i class="fa-solid fa-trash"></i></button>
      </div>
    </div>
    <div class="field"><label>Question *</label><textarea class="q-text-in" data-q="${q.id}" placeholder="Enter your question...">${esc(q.text)}</textarea></div>
    ${body}
    <div class="field" style="margin-bottom:0"><label>Explanation <span class="hint">(shown in review)</span></label><textarea class="q-expl-in" data-q="${q.id}" placeholder="Explain the correct answer...">${esc(q.explanation)}</textarea></div>
  </div>`;
}

function bindQuestionEditors() {
  $$('.q-text-in').forEach(t => t.addEventListener('input', e => { qById(e.target.dataset.q).text = e.target.value; }));
  $$('.q-expl-in').forEach(t => t.addEventListener('input', e => { qById(e.target.dataset.q).explanation = e.target.value; }));
  $$('.mc-opt').forEach(t => t.addEventListener('input', e => { qById(e.target.dataset.q).options[+e.target.dataset.oi] = e.target.value; }));
  $$('.mc-correct').forEach(r => r.addEventListener('change', e => { qById(e.target.dataset.q).correct = +e.target.value; }));
  $$('.tf-correct').forEach(r => r.addEventListener('change', e => { qById(e.target.dataset.q).correct = (e.target.value === 'true'); }));
  $$('.short-correct').forEach(t => t.addEventListener('input', e => { qById(e.target.dataset.q).correct = e.target.value; }));
}

const qById = id => draft.questions.find(q => q.id === id);

function addQuestion(type) { draft.questions.push(blankQuestion(type)); renderQuestions(); window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }); }
function addOption(qid) { const q = qById(qid); if (q.options.length < 8) { q.options.push(''); renderQuestions(); } else toast('Max 8 options', 'err'); }
function removeOption(qid, oi) { const q = qById(qid); if (q.options.length <= 2) return; q.options.splice(oi, 1); if (q.correct >= q.options.length) q.correct = 0; else if (q.correct > oi) q.correct--; renderQuestions(); }
function delQuestion(qid) { if (draft.questions.length <= 1) { toast('A quiz needs at least one question', 'err'); return; } draft.questions = draft.questions.filter(q => q.id !== qid); renderQuestions(); }
function dupQuestion(qid) { const q = qById(qid); const c = JSON.parse(JSON.stringify(q)); c.id = uid(); const idx = draft.questions.findIndex(x => x.id === qid); draft.questions.splice(idx + 1, 0, c); renderQuestions(); }
function moveQuestion(qid, dir) { const idx = draft.questions.findIndex(q => q.id === qid); const ni = idx + dir; if (ni < 0 || ni >= draft.questions.length) return; const [q] = draft.questions.splice(idx, 1); draft.questions.splice(ni, 0, q); renderQuestions(); }

function validateDraft() {
  if (!draft.title.trim()) return 'Please enter a quiz title.';
  if (!draft.questions.length) return 'Add at least one question.';
  for (let i = 0; i < draft.questions.length; i++) {
    const q = draft.questions[i];
    if (!q.text.trim()) return `Question ${i + 1} is missing text.`;
    if (q.type === 'mc') {
      const filled = q.options.filter(o => o.trim());
      if (filled.length < 2) return `Question ${i + 1} needs at least 2 options.`;
      if (!q.options[q.correct] || !q.options[q.correct].trim()) return `Question ${i + 1}: mark a valid correct option.`;
    }
    if (q.type === 'short' && !String(q.correct).trim()) return `Question ${i + 1} needs a correct answer.`;
  }
  return null;
}

function saveDraft() {
  const err = validateDraft();
  if (err) { toast(err, 'err'); return; }
  draft.updatedAt = Date.now();
  // Clean MC empty options
  draft.questions.forEach(q => { if (q.type === 'mc') { q.options = q.options.map(o => o.trim()); } });
  const existing = getQuiz(draft.id);
  if (existing) { Object.assign(existing, JSON.parse(JSON.stringify(draft))); }
  else { quizzes.unshift(JSON.parse(JSON.stringify(draft))); }
  persistQuizzes();
  toast('Quiz saved', 'ok');
  renderQuizzes(); showView('quizzes');
}

/* =====================================================================
   PLAYER
   ===================================================================== */
function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function startQuiz(id) {
  const quiz = getQuiz(id);
  if (!quiz || !quiz.questions.length) { toast('This quiz has no questions', 'err'); return; }

  // Build runtime questions (deep-copied, optionally shuffled)
  let qs = JSON.parse(JSON.stringify(quiz.questions));
  if (quiz.settings.shuffleQuestions) qs = shuffle(qs);
  qs.forEach(q => {
    if (q.type === 'mc' && quiz.settings.shuffleAnswers) {
      const correctText = q.options[q.correct];
      q.options = shuffle(q.options);
      q.correct = q.options.indexOf(correctText);
    }
    q.userAnswer = null;
  });

  player = { quiz, questions: qs, index: 0, timeLeft: (quiz.settings.timer || 0) * 60, timerId: null, startTime: Date.now() };

  if (player.timeLeft > 0) startTimer();
  showView('player');
  renderPlayer();
}

function startTimer() {
  clearInterval(player.timerId);
  player.timerId = setInterval(() => {
    player.timeLeft--;
    updateTimerDisplay();
    if (player.timeLeft <= 0) { clearInterval(player.timerId); toast('Time is up!', 'err'); finishQuiz(); }
  }, 1000);
}
function fmtTime(s) { const m = Math.floor(s / 60), sec = s % 60; return `${m}:${String(sec).padStart(2, '0')}`; }
function updateTimerDisplay() {
  const t = $('#timer-display'); if (!t) return;
  t.textContent = fmtTime(player.timeLeft);
  t.parentElement.classList.toggle('warn', player.timeLeft <= 30);
}

function renderPlayer() {
  const { quiz, questions, index } = player;
  const q = questions[index];
  const total = questions.length;
  const pct = Math.round(((index) / total) * 100);

  const el = $('#view-player');
  el.innerHTML = `
    <div class="player-wrap">
      <div class="player-head">
        <div><h2>${esc(quiz.title)}</h2></div>
        ${player.timeLeft > 0 || quiz.settings.timer ? `<div class="timer"><i class="fa-solid fa-stopwatch"></i> <span id="timer-display">${fmtTime(player.timeLeft)}</span></div>` : ''}
      </div>
      <div class="progress-wrap">
        <div class="progress-info"><span>Question ${index + 1} of ${total}</span><span>${answeredCount()} answered</span></div>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      </div>

      <div class="card question-card">
        <div class="q-type-tag">${({mc:'Multiple Choice',tf:'True / False',short:'Short Answer'})[q.type]}</div>
        <div class="q-text">${esc(q.text)}</div>
        <div class="answers" id="answers-area">${answerArea(q)}</div>
      </div>

      <div class="player-nav">
        <button class="btn btn-ghost" id="prev-btn" ${index===0?'disabled style=opacity:.4':''}><i class="fa-solid fa-arrow-left"></i> Previous</button>
        ${index === total - 1
          ? `<button class="btn btn-primary" id="submit-btn"><i class="fa-solid fa-flag-checkered"></i> Submit Quiz</button>`
          : `<button class="btn btn-primary" id="next-btn">Next <i class="fa-solid fa-arrow-right"></i></button>`}
      </div>
      <div style="text-align:center;margin-top:16px">
        <button class="btn btn-danger btn-sm" id="quit-btn"><i class="fa-solid fa-xmark"></i> Quit quiz</button>
      </div>
    </div>`;

  bindAnswerInputs(q);
  if ($('#prev-btn')) $('#prev-btn').onclick = () => { if (player.index > 0) { player.index--; renderPlayer(); } };
  if ($('#next-btn')) $('#next-btn').onclick = () => { player.index++; renderPlayer(); };
  if ($('#submit-btn')) $('#submit-btn').onclick = confirmSubmit;
  $('#quit-btn').onclick = quitQuiz;
  if ($('#timer-display')) updateTimerDisplay();
}

function answeredCount() { return player.questions.filter(q => q.userAnswer !== null && q.userAnswer !== '').length; }

function answerArea(q) {
  if (q.type === 'mc') {
    return q.options.map((o, i) => `
      <div class="answer-opt ${q.userAnswer===i?'selected':''}" data-i="${i}">
        <span class="letter">${String.fromCharCode(65 + i)}</span><span>${esc(o)}</span>
      </div>`).join('');
  }
  if (q.type === 'tf') {
    return [['true','True','fa-check'],['false','False','fa-xmark']].map(([v, lbl, ic]) => `
      <div class="answer-opt ${String(q.userAnswer)===v?'selected':''}" data-v="${v}">
        <span class="letter"><i class="fa-solid ${ic}"></i></span><span>${lbl}</span>
      </div>`).join('');
  }
  return `<div class="short-answer"><input type="text" id="short-in" placeholder="Type your answer..." value="${esc(q.userAnswer || '')}"></div>`;
}

function bindAnswerInputs(q) {
  if (q.type === 'mc') {
    $$('#answers-area .answer-opt').forEach(opt => opt.onclick = () => { q.userAnswer = +opt.dataset.i; renderPlayer(); });
  } else if (q.type === 'tf') {
    $$('#answers-area .answer-opt').forEach(opt => opt.onclick = () => { q.userAnswer = (opt.dataset.v === 'true'); renderPlayer(); });
  } else {
    const inp = $('#short-in');
    inp.oninput = () => { q.userAnswer = inp.value; };
  }
}

async function quitQuiz() {
  const ok = await confirmDialog({ title: 'Quit quiz?', message: 'Your progress will be lost and no score recorded.', confirmText: 'Quit', danger: true });
  if (!ok) return;
  clearInterval(player.timerId); player = null;
  renderQuizzes(); showView('quizzes');
}

async function confirmSubmit() {
  const unanswered = player.questions.length - answeredCount();
  if (unanswered > 0) {
    const ok = await confirmDialog({ title: 'Submit quiz?', message: `You have ${unanswered} unanswered question(s). Submit anyway?`, confirmText: 'Submit' });
    if (!ok) return;
  }
  finishQuiz();
}

function checkAnswer(q) {
  if (q.type === 'mc') return q.userAnswer === q.correct;
  if (q.type === 'tf') return q.userAnswer === q.correct;
  if (q.type === 'short') return String(q.userAnswer || '').trim().toLowerCase() === String(q.correct).trim().toLowerCase();
  return false;
}

function finishQuiz() {
  clearInterval(player.timerId);
  const { quiz, questions, startTime } = player;
  let score = 0;
  questions.forEach(q => { q.isCorrect = checkAnswer(q); if (q.isCorrect) score++; });
  const total = questions.length;
  const percentage = Math.round((score / total) * 100);
  const timeSpent = Math.round((Date.now() - startTime) / 1000);

  const record = { id: uid(), quizId: quiz.id, title: quiz.title, subject: quiz.subject, score, total, percentage, timeSpent, date: Date.now() };
  history.push(record); persistHistory();

  player.result = { score, total, percentage, timeSpent, questions };
  showView('results'); renderResults();
}

/* =====================================================================
   RESULTS
   ===================================================================== */
function renderResults() {
  const { score, total, percentage, timeSpent, questions } = player.result;
  const quiz = player.quiz;
  const c = scoreColor(percentage);
  const msg = percentage >= 90 ? 'Outstanding! \u{1F3C6}' : percentage >= 70 ? 'Great job! \u{1F44F}' : percentage >= 50 ? 'Good effort! \u{1F44D}' : 'Keep practicing! \u{1F4AA}';
  const wrong = questions.filter(q => !q.isCorrect).length;

  const el = $('#view-results');
  el.innerHTML = `
    <div class="results-wrap">
      <div class="card result-hero">
        <div class="score-ring" style="background:conic-gradient(${c} ${percentage*3.6}deg, var(--card-2) 0deg)">
          <div class="inner"><div class="pct" style="color:${c}">${percentage}%</div><div class="frac">${score} / ${total}</div></div>
        </div>
        <div class="result-msg">${msg}</div>
        <div class="result-sub">${esc(quiz.title)}</div>
        <div class="result-summary">
          <div class="rsum"><div class="n" style="color:var(--ok)">${score}</div><div class="l">Correct</div></div>
          <div class="rsum"><div class="n" style="color:var(--err)">${wrong}</div><div class="l">Incorrect</div></div>
          <div class="rsum"><div class="n">${fmtTime(timeSpent)}</div><div class="l">Time</div></div>
        </div>
      </div>

      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px">
        <button class="btn btn-primary" onclick="startQuiz('${quiz.id}')"><i class="fa-solid fa-rotate-right"></i> Retake</button>
        <button class="btn btn-ghost" onclick="renderQuizzes();showView('quizzes')"><i class="fa-solid fa-layer-group"></i> All Quizzes</button>
        <button class="btn btn-ghost" onclick="renderDashboard();showView('dashboard')"><i class="fa-solid fa-gauge-high"></i> Dashboard</button>
      </div>

      <h3 style="font-size:18px;font-weight:800;margin-bottom:14px">Answer Review</h3>
      ${questions.map(reviewItem).join('')}
      <div style="height:20px"></div>
    </div>`;
}

function reviewItem(q) {
  const correct = q.isCorrect;
  let yourAns, rightAns;
  if (q.type === 'mc') { yourAns = q.userAnswer != null ? q.options[q.userAnswer] : '(no answer)'; rightAns = q.options[q.correct]; }
  else if (q.type === 'tf') { yourAns = q.userAnswer == null ? '(no answer)' : (q.userAnswer ? 'True' : 'False'); rightAns = q.correct ? 'True' : 'False'; }
  else { yourAns = q.userAnswer ? q.userAnswer : '(no answer)'; rightAns = q.correct; }

  return `<div class="card review-item ${correct?'correct':'wrong'}">
    <div class="ri-head">
      <div class="ri-icon ${correct?'correct':'wrong'}"><i class="fa-solid ${correct?'fa-check':'fa-xmark'}"></i></div>
      <div class="ri-q">${esc(q.text)}</div>
    </div>
    <div class="ri-ans yours ${correct?'ok':''}"><span class="lbl">Your answer</span>${esc(yourAns)}</div>
    ${correct ? '' : `<div class="ri-ans right"><span class="lbl">Correct</span>${esc(rightAns)}</div>`}
    ${q.explanation ? `<div class="ri-expl"><i class="fa-solid fa-lightbulb"></i>${esc(q.explanation)}</div>` : ''}
  </div>`;
}

/* =====================================================================
   HISTORY
   ===================================================================== */
function renderHistory() {
  const el = $('#view-history');
  const list = [...history].reverse();
  el.innerHTML = `
    <div class="page-head">
      <div><h2>Quiz History</h2><p>${history.length} attempt${history.length===1?'':'s'} recorded.</p></div>
      <div class="head-actions">
        ${history.length ? `<button class="btn btn-danger" onclick="clearHistory()"><i class="fa-solid fa-trash"></i> Clear History</button>` : ''}
      </div>
    </div>
    ${list.length ? `<div class="card panel">${list.map(attemptRow).join('')}</div>`
      : `<div class="empty"><i class="fa-solid fa-clock-rotate-left"></i><h3>No attempts yet</h3><p>Take a quiz and your results will appear here.</p><button class="btn btn-primary" onclick="renderQuizzes();showView('quizzes')"><i class="fa-solid fa-play"></i> Take a Quiz</button></div>`}`;
}

async function clearHistory() {
  const ok = await confirmDialog({ title: 'Clear all history?', message: 'All recorded attempts and scores will be deleted. Quizzes are kept.', confirmText: 'Clear', danger: true });
  if (!ok) return;
  history = []; persistHistory(); renderHistory(); toast('History cleared', 'ok');
}

/* =====================================================================
   IMPORT / EXPORT
   ===================================================================== */
function downloadJSON(filename, dataObj) {
  const blob = new Blob([JSON.stringify(dataObj, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
const slug = s => (s || 'quiz').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

function exportQuiz(id) {
  const q = getQuiz(id); if (!q) return;
  downloadJSON(`${slug(q.title)}.quizforge.json`, { type: 'quizforge-quiz', version: 1, quiz: q });
  toast('Quiz exported', 'ok');
}

function exportAll() {
  downloadJSON(`quizforge-backup-${new Date().toISOString().slice(0,10)}.json`, {
    type: 'quizforge-backup', version: 1, exportedAt: Date.now(),
    quizzes, history, settings
  });
  toast('Backup exported', 'ok');
}
$('#nav-export-all').addEventListener('click', exportAll);

/* Import trigger + file handling */
function triggerImport() { $('#file-input').click(); }
$('#nav-import').addEventListener('click', showImportModal);

function showImportModal() {
  openModal(`
    <h3>Import Quizzes</h3>
    <p>Import a QuizForge quiz file, a full backup, or drag &amp; drop below.</p>
    <div class="drop-zone" id="drop-zone">
      <i class="fa-solid fa-cloud-arrow-up"></i>
      <div style="font-weight:600">Drop .json files here</div>
      <div style="font-size:13px">or click to browse</div>
    </div>
    <div class="modal-actions" style="margin-top:20px">
      <button class="btn btn-ghost" onclick="closeModal()">Close</button>
    </div>`);
  const dz = $('#drop-zone');
  dz.onclick = triggerImport;
  dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag'); });
  dz.addEventListener('dragleave', () => dz.classList.remove('drag'));
  dz.addEventListener('drop', e => {
    e.preventDefault(); dz.classList.remove('drag');
    handleFiles(e.dataTransfer.files);
  });
}

$('#file-input').addEventListener('change', e => { handleFiles(e.target.files); e.target.value = ''; });

function handleFiles(files) {
  const arr = Array.from(files).filter(f => f.name.endsWith('.json') || f.type === 'application/json');
  if (!arr.length) { toast('No JSON files selected', 'err'); return; }
  arr.forEach(file => {
    const reader = new FileReader();
    reader.onload = () => { try { processImport(JSON.parse(reader.result)); } catch { toast(`Invalid JSON: ${file.name}`, 'err'); } };
    reader.onerror = () => { toast(`Could not read ${file.name}`, 'err'); };
    reader.readAsText(file);
  });
}

function normalizeQuiz(q) {
  // Ensure required fields exist and are valid
  if (!q || !q.title || !Array.isArray(q.questions)) return null;
  q.id = q.id || uid();
  q.settings = q.settings || { timer: 0, shuffleQuestions: false, shuffleAnswers: false };
  q.createdAt = q.createdAt || Date.now();
  q.updatedAt = q.updatedAt || Date.now();
  q.questions = q.questions.map(qq => ({
    id: qq.id || uid(),
    type: ['mc','tf','short'].includes(qq.type) ? qq.type : 'mc',
    text: qq.text || '',
    options: qq.options || [],
    correct: qq.correct,
    explanation: qq.explanation || ''
  }));
  return q;
}

function processImport(data) {
  // Full backup
  if (data && data.type === 'quizforge-backup') {
    showBackupImportOptions(data);
    return;
  }
  // Single quiz file or bare quiz object
  let quiz = data && data.type === 'quizforge-quiz' ? data.quiz : data;
  quiz = normalizeQuiz(quiz);
  if (!quiz) { toast('Unrecognized quiz file', 'err'); return; }
  importSingleQuiz(quiz);
}

function importSingleQuiz(quiz) {
  const dup = quizzes.find(q => q.title.toLowerCase() === quiz.title.toLowerCase());
  if (dup) {
    openModal(`
      <h3>Duplicate detected</h3>
      <p>A quiz titled "<strong>${esc(quiz.title)}</strong>" already exists. What would you like to do?</p>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="imp-skip">Skip</button>
        <button class="btn btn-ghost" id="imp-keep">Import as Copy</button>
        <button class="btn btn-primary" id="imp-replace">Replace</button>
      </div>`);
    $('#imp-skip').onclick = () => { closeModal(); toast('Import skipped', 'info'); };
    $('#imp-keep').onclick = () => {
      quiz.id = uid(); quiz.title += ' (Imported)'; quiz.questions.forEach(q => q.id = uid());
      quizzes.unshift(quiz); persistQuizzes(); closeModal(); afterImport();
    };
    $('#imp-replace').onclick = () => {
      quiz.id = dup.id; Object.assign(dup, quiz); persistQuizzes(); closeModal(); afterImport();
    };
    return;
  }
  quiz.id = quiz.id || uid();
  quizzes.unshift(quiz); persistQuizzes(); afterImport();
}

function showBackupImportOptions(data) {
  const count = (data.quizzes || []).length;
  openModal(`
    <h3>Import Backup</h3>
    <p>This backup contains <strong>${count}</strong> quiz${count===1?'':'zes'}${data.history?` and ${data.history.length} history record(s)`:''}. Choose how to import.</p>
    <div class="modal-actions" style="flex-direction:column;align-items:stretch">
      <button class="btn btn-primary btn-block" id="bk-merge"><i class="fa-solid fa-code-merge"></i> Merge with my quizzes</button>
      <button class="btn btn-danger btn-block" id="bk-replace"><i class="fa-solid fa-arrows-rotate"></i> Replace everything</button>
      <button class="btn btn-ghost btn-block" onclick="closeModal()">Cancel</button>
    </div>`);

  $('#bk-merge').onclick = () => {
    let added = 0, replaced = 0;
    (data.quizzes || []).forEach(raw => {
      const q = normalizeQuiz(raw); if (!q) return;
      const dup = quizzes.find(x => x.title.toLowerCase() === q.title.toLowerCase());
      if (dup) { q.id = dup.id; Object.assign(dup, q); replaced++; }
      else { q.id = q.id || uid(); quizzes.unshift(q); added++; }
    });
    // Merge history (avoid dup by id)
    if (Array.isArray(data.history)) {
      const ids = new Set(history.map(h => h.id));
      data.history.forEach(h => { if (!ids.has(h.id)) history.push(h); });
      persistHistory();
    }
    persistQuizzes(); closeModal();
    toast(`Merged: ${added} added, ${replaced} updated`, 'ok');
    afterImport(true);
  };

  $('#bk-replace').onclick = async () => {
    closeModal();
    const ok = await confirmDialog({ title: 'Replace all data?', message: 'This will overwrite ALL your current quizzes and history with the backup. This cannot be undone.', confirmText: 'Replace', danger: true });
    if (!ok) return;
    quizzes = (data.quizzes || []).map(normalizeQuiz).filter(Boolean);
    history = Array.isArray(data.history) ? data.history : [];
    if (data.settings && data.settings.theme) { settings.theme = data.settings.theme; persistSettings(); applyTheme(); }
    persistQuizzes(); persistHistory();
    toast('Data restored from backup', 'ok');
    afterImport(true);
  };
}

function afterImport(full) {
  // Refresh whichever view is relevant
  renderQuizzes(); renderDashboard(); renderHistory();
  if (full) toast('Import complete', 'ok'); else toast('Quiz imported', 'ok');
  showView('quizzes');
}

/* =====================================================================
   INIT
   ==================================================================== */
applyTheme();
renderDashboard();
renderQuizzes();
renderHistory();
showView('dashboard');

// Expose functions used by inline onclick handlers
Object.assign(window, {
  openCreator, showView, startQuiz, deleteQuiz, duplicateQuiz, renameQuiz,
  addQuestion, addOption, removeOption, delQuestion, dupQuestion, moveQuestion,
  exportQuiz, exportAll, triggerImport, closeModal, clearHistory,
  renderQuizzes, renderDashboard, renderHistory
});
</script>
</body>
</html>
